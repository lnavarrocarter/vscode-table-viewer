name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag must match package.json version')"

      - name: Build and test packaged extension
        run: npm test

      - name: Check Marketplace publishing credential
        id: marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -n "$VSCE_PAT" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VSCE_PAT is not configured; Marketplace publishing will be skipped."
          fi

      - name: Publish tested VSIX to VS Code Marketplace
        if: steps.marketplace.outputs.available == 'true'
        run: ./node_modules/.bin/vsce publish --packagePath table-viewer.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: table-viewer.vsix
          generate_release_notes: true
          make_latest: true
